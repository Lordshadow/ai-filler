[project]
name = "ai-filler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lordshadow", email = "kaadithiya@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.4",
    "groq<1",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rapidocr-onnxruntime>=1.2.0",
]

[project.scripts]
ai-filler = "ai_filler:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
